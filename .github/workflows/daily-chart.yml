name: Daily chart

on:
  schedule:
    - cron: "41 14 * * *"   # 14:41 UTC, mid-morning in the US
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch today's chart and add it to the history
        run: |
          # Surface any error as an annotation, so it shows on the run page without opening the log.
          run() { "$@" 2> err.txt || { echo "::error::$* failed: $(tail -c 1500 err.txt | tr '\n' ' ')"; exit 1; }; cat err.txt >&2; }
          run python main.py fetch
          run python main.py export --out site/chart.json
          python main.py report --runs 7 >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv site/chart.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Record chart for $(date -u +%Y-%m-%d)"
          git push
