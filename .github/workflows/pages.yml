name: Publish page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # Pushes made by the daily job's token do not trigger workflows, so publish
  # again whenever the daily chart run finishes.
  workflow_run:
    workflows: ["Daily chart"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check there is a chart to publish
        run: test -s site/chart.json || { echo "::error::site/chart.json is missing; run the Daily chart workflow first"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
